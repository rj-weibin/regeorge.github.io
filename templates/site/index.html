<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>reGeorge | Personal AI OS</title>
  <style>
    :root{--bg:#f7f4ed;--ink:#292521;--muted:#736b60;--line:#ddd5c9;--card:#fffdf9;--accent:#b46c4b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif}.wrap{width:min(1120px,calc(100% - 30px));margin:auto;padding:24px 0 50px}header{display:flex;justify-content:space-between;align-items:center;padding:10px 0 30px;border-bottom:1px solid var(--line)}.brand{font:700 1.5rem Georgia,serif}.links{display:flex;gap:16px}.links a{color:var(--muted);text-decoration:none}.links a:hover{color:var(--accent)}.intro{margin:28px 0 8px;max-width:800px;color:var(--muted);line-height:1.9}.dimension{margin:28px 0 38px}.dimension-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}.icon{font-size:1.6rem}.dimension-name{font:700 1.35rem Georgia,serif}.dimension-intro{color:var(--muted);font-size:.95rem;margin-top:4px;max-width:720px;line-height:1.8}.dimension-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:16px}.dim-card{display:block;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:inherit;text-decoration:none;transition:transform .18s ease,box-shadow .18s ease}.dim-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px #6b4d2b12}.dim-row{display:flex;align-items:baseline;gap:8px;margin:8px 0 0}.dim-row .tag{color:var(--accent);font-size:.72rem;font-weight:600;letter-spacing:.04em;flex-shrink:0}.dim-row p{margin:0;color:var(--muted);line-height:1.65;font-size:.9rem}.dim-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}.dim-link{font-size:.8rem;color:var(--accent);text-decoration:none;font-weight:500}.dim-link:hover{text-decoration:underline}.meta{display:block;margin-top:13px;color:var(--accent);font-size:.8rem}footer{padding-top:28px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}.empty{color:var(--muted);padding:30px 0}@media(max-width:600px){header{align-items:flex-start;gap:16px}.links{font-size:.86rem;flex-direction:column;gap:5px;text-align:right}}
  </style>
</head>
<body>
  <main class="wrap">
    <header><div class="brand">reGeorge</div><nav class="links"><a href="resume/index.html">简历</a><a href="https://github.com/regeorge" target="_blank" rel="noreferrer">GitHub</a></nav></header>
    <p class="intro">阅读校准判断，工作把判断做成系统，生活和乒乓让判断回到真实的体验里。四件事，按它们当下的问题、证据和下一步来记。</p>
    <div id="project-root"><div class="empty">正在读取项目事实……</div></div>
    <footer>© 2026 reGeorge · Personal AI OS</footer>
  </main>
  <script>
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    fetch('data/dimensions.json').then(r=>{if(!r.ok)throw new Error('dimensions data load failed');return r.json()}).then(dimensions=>{document.querySelector('#project-root').innerHTML=dimensions.map(dim=>`<section class="dimension"><div class="dimension-head"><span class="icon">${esc(dim.icon)}</span><span class="dimension-name">${esc(dim.title)}</span></div><p class="dimension-intro">${esc(dim.intro)}</p><div class="dimension-grid"><div class="dim-card"><div class="dim-row"><span class="tag">当前问题</span><p>${esc(dim.problem)}</p></div><div class="dim-row"><span class="tag">最近证据</span><p>${esc(dim.evidence)}</p></div><div class="dim-row"><span class="tag">下一步</span><p>${esc(dim.next)}</p></div><div class="dim-links">${dim.pages.map(p=>`<a class="dim-link" href="${esc(p.href)}">${esc(p.title)} →</a>`).join('')}</div></div></div></section>`).join('')}).catch(error=>{document.querySelector('#project-root').innerHTML=`<div class="empty">项目事实读取失败：${esc(error.message)}</div>`});
  </script>
</body>
</html>
