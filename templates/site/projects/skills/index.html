<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工程 Skills · reGeorge</title>
  <style>
    :root{--bg:#f3efe7;--paper:#fffdf8;--panel:#faf5eb;--ink:#2d2924;--muted:#756c61;--line:#ded5c8;--coral:#a8583f;--teal:#226b68;--blue:#35689a;--gold:#a47732;--shadow:0 18px 46px rgba(71,51,30,.09);--serif:Georgia,"Songti SC",serif;--sans:"Segoe UI Variable Text","PingFang SC","Microsoft YaHei",sans-serif;--mono:Consolas,monospace}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:var(--sans);background:radial-gradient(circle at 5% 0%,#e7d7c4 0,transparent 28%),linear-gradient(180deg,#f9f6ef,#eee7dc);line-height:1.7}.shell{width:min(1240px,calc(100% - 32px));margin:auto;padding:22px 0 64px}.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 0 22px;border-bottom:1px solid var(--line)}.topbar a{color:var(--muted);text-decoration:none}.topbar a:hover{color:var(--coral)}.brand{font:700 1.2rem var(--serif)}.hero{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(290px,.78fr);gap:24px;margin-top:24px;padding:40px 42px;background:linear-gradient(145deg,rgba(255,253,248,.97),rgba(249,242,231,.9));border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:390px;height:390px;right:-125px;top:-185px;border-radius:50%;background:radial-gradient(circle,#d8b39d88,transparent 68%);pointer-events:none}.eyebrow{color:var(--coral);font:700 .76rem var(--mono);letter-spacing:.12em;text-transform:uppercase}.hero h1{max-width:780px;margin:12px 0 14px;font:700 clamp(2.3rem,5vw,4.8rem)/1 var(--serif);letter-spacing:-.04em}.subtitle{max-width:760px;margin:0;color:var(--muted);font-size:1.08rem}.signal{margin:22px 0 0;padding:16px 18px;border-left:4px solid var(--teal);background:rgba(231,240,237,.68);font:700 1.03rem/1.65 var(--serif)}.hero-card,.panel{background:rgba(255,253,248,.9);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.hero-card{padding:22px;position:relative;z-index:1}.hero-card h2{margin:7px 0 12px;font:700 1.45rem var(--serif)}.model-stack{display:grid;gap:8px}.model-node{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-weight:700}.model-node span{display:block;color:var(--muted);font-size:.82rem;font-weight:400}.model-arrow{text-align:center;color:var(--coral);line-height:1}.status-row,.tags,.jump,.filters,.stats{display:flex;flex-wrap:wrap;gap:8px}.status-row{margin-top:20px}.pill,.tag{padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.64);color:var(--muted);font-size:.78rem}.pill.accent,.tag.accent{color:var(--coral);border-color:#c99c8a}.jump{margin:18px 0}.jump a,.filter{padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.72);color:var(--muted);text-decoration:none;font:inherit;cursor:pointer}.jump a:hover,.filter:hover,.filter.active{color:#fff;background:var(--teal);border-color:var(--teal)}.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px;align-items:start}.rail{position:sticky;top:18px;display:grid;gap:14px}.rail-card{padding:17px;background:rgba(255,253,248,.82);border:1px solid var(--line);border-radius:16px}.rail-title,.section-kicker{margin:0 0 9px;color:var(--coral);font:700 .72rem var(--mono);letter-spacing:.1em}.rail nav{display:grid;gap:6px}.rail a{color:var(--muted);text-decoration:none;font-size:.9rem}.rail a:hover{color:var(--coral)}.rail-note{margin:0;color:var(--muted);font-size:.83rem;line-height:1.6}.content{min-width:0}.section{margin-bottom:36px}.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:14px}.section-head h2{margin:0;font:700 1.75rem var(--serif)}.section-head p{margin:0;color:var(--muted);font-size:.88rem}.stats{margin:0 0 14px}.stat{min-width:130px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px}.stat strong{display:block;color:var(--coral);font:700 1.45rem var(--serif)}.stat span{color:var(--muted);font-size:.8rem}.principle-grid,.skill-grid,.detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.principle,.skill-card,.detail-card{padding:18px;background:var(--paper);border:1px solid var(--line);border-radius:16px}.principle{border-top:3px solid var(--teal)}.principle h3,.skill-card h3,.detail-card h3{margin:0 0 7px;font-size:1rem}.principle p,.skill-card p,.detail-card p{margin:0;color:var(--muted);font-size:.9rem}.toolbar{display:grid;gap:12px;padding:18px;background:rgba(255,253,248,.66);border:1px solid var(--line);border-radius:17px}.search{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fffdf9;color:var(--ink);font:inherit}.search:focus{outline:2px solid #226b6844;border-color:var(--teal)}.filter-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.filter-label{color:var(--muted);font-size:.8rem;min-width:48px}.result-line{margin:15px 0 10px;color:var(--muted);font-size:.84rem}.skill-card{display:block;color:inherit;text-decoration:none;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}.skill-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(71,51,30,.1);border-color:#c99c8a}.card-meta{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px;color:var(--coral);font:700 .7rem var(--mono);letter-spacing:.06em}.card-meta span:last-child{color:var(--muted);font-weight:400;letter-spacing:0}.skill-card .subtitle-card{min-height:52px}.skill-card .card-foot{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.skill-card .tag{font-size:.7rem;padding:3px 8px}.empty{padding:28px;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:14px}.detail-hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin:24px 0 22px;padding:28px 30px;background:rgba(255,253,248,.92);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.detail-hero h1{margin:7px 0 8px;font:700 clamp(2rem,4vw,3.5rem)/1.1 var(--serif)}.detail-hero p{max-width:760px;margin:0;color:var(--muted)}.back{display:inline-flex;white-space:nowrap;padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);text-decoration:none;font-size:.85rem}.back:hover{color:#fff;background:var(--teal);border-color:var(--teal)}.workflow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.workflow-step{position:relative;padding:17px 15px;background:var(--panel);border:1px solid var(--line);border-radius:14px}.workflow-step:not(:last-child):after{content:"→";position:absolute;right:-15px;top:29px;color:var(--coral);font-weight:700;z-index:1}.workflow-num{color:var(--coral);font:700 .72rem var(--mono)}.workflow-step h3{margin:7px 0 5px;font-size:1rem}.workflow-step p{margin:0;color:var(--muted);font-size:.85rem}.detail-grid{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:14px}.detail-card{min-height:150px}.detail-card.wide{grid-column:1/-1}.detail-card h3{display:flex;align-items:center;gap:8px}.detail-card h3:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--teal)}.detail-card ul{margin:8px 0 0;padding-left:20px;color:var(--muted);font-size:.88rem}.detail-card li+li{margin-top:4px}.detail-card .plain{color:var(--muted);font-size:.9rem}.related{display:flex;flex-wrap:wrap;gap:8px}.related a{padding:8px 11px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;font-size:.86rem}.related a:hover{border-color:var(--teal);color:var(--teal)}.footer{margin-top:30px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:.82rem}@media(max-width:980px){.principle-grid,.skill-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.workflow{grid-template-columns:repeat(2,1fr)}.workflow-step:not(:last-child):after{display:none}}@media(max-width:760px){.hero,.detail-hero{grid-template-columns:1fr;display:grid;padding:28px 24px}.layout{grid-template-columns:1fr}.rail{position:static;display:none}.principle-grid,.skill-grid,.detail-grid{grid-template-columns:1fr}.detail-card.wide{grid-column:auto}.section-head{display:block}.section-head p{margin-top:4px}.workflow{grid-template-columns:1fr}.topbar{align-items:flex-start;gap:12px}.topbar a:last-child{font-size:.85rem}}
  </style>
</head>
<body>
  <main class="shell">
    <nav class="topbar"><a class="brand" href="../../index.html">reGeorge · Personal AI OS</a><a href="../../index.html">返回首页</a></nav>
    <div id="app" class="content"><div class="empty" style="margin-top:24px">正在读取 Skills 事实……</div></div>
    <p class="footer">事实源：data/skills/skills-index.json · 页面由 build-site.mjs 生成</p>
  </main>
  <script>
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const list=items=>(items||[]).map(item=>`<li>${esc(item)}</li>`).join('');
    const stageLabels=['理解','设计','探测','执行','验证','沉淀'];
    const layerLabels={capability:'通用能力',both:'通用能力 + 个人方式',workStyle:'个人工作方式'};
    const load=path=>fetch(path).then(response=>{if(!response.ok)throw new Error(`${path} load failed`);return response.json()});
    const skillById=(skills,id)=>skills.find(skill=>skill.id===id);
    function shellHeader(data,detail){
      return `<header class="${detail?'detail-hero':'hero'}"><div><div class="eyebrow">${detail?'SKILL DETAIL · ENGINEERING PRACTICE':'ENGINEERING SKILLS · METHOD → EVIDENCE → ASSET'}</div><h1>${esc(detail?detail.title:data.title)}</h1><p class="subtitle">${esc(detail?detail.subtitle:data.subtitle)}</p><div class="status-row"><span class="pill accent">${detail?esc(detail.category):'8 项公开能力'}</span><span class="pill">${detail?esc(layerLabels[detail.layer]||detail.layer):'通用能力 + 个人工作方式'}</span><span class="pill">最后整理：${esc(data.updatedAt)}</span></div>${detail?'':'<blockquote class="signal">'+esc(data.thesis)+'</blockquote>'}</div>${detail?'<a class="back" href="index.html">← 返回 Skills</a>':'<aside class="hero-card"><div class="section-kicker">OPERATING MODEL</div><h2>把判断变成资产</h2><div class="model-stack"><div class="model-node">看见问题<span>提取意图与未知点</span></div><div class="model-arrow">↓</div><div class="model-node">验证路径<span>样本、证据与门禁</span></div><div class="model-arrow">↓</div><div class="model-node">留下复用<span>结论、流程与工作方式</span></div></div></aside>'}</header>`;
    }
    function renderPrinciples(data){
      return `<section class="section" id="style"><div class="section-head"><h2>个人工作方式</h2><p>${esc(data.layers.workStyle.description)}</p></div><div class="principle-grid">${data.personalPrinciples.map(item=>`<article class="principle"><h3>${esc(item.title)}</h3><p>${esc(item.description)}</p></article>`).join('')}</div></section>`;
    }
    function renderStats(data){
      const categories=new Set(data.skills.map(skill=>skill.category)).size;
      const stages=new Set(data.skills.flatMap(skill=>skill.stages)).size;
      return `<div class="stats"><div class="stat"><strong>${data.skills.length}</strong><span>公开 Skill</span></div><div class="stat"><strong>${categories}</strong><span>能力类别</span></div><div class="stat"><strong>${stages}</strong><span>流程阶段</span></div><div class="stat"><strong>${data.personalPrinciples.length}</strong><span>工作原则</span></div></div>`;
    }
    function renderCard(skill){
      return `<a class="skill-card" href="?skill=${encodeURIComponent(skill.id)}#detail"><div class="card-meta"><span>${esc(skill.category)}</span><span>${esc(layerLabels[skill.layer]||skill.layer)}</span></div><h3>${esc(skill.title)}</h3><p class="subtitle-card">${esc(skill.subtitle)}</p><div class="card-foot">${skill.stages.map(stage=>`<span class="tag">${esc(stage)}</span>`).join('')}</div></a>`;
    }
    function renderFilters(data){
      const categories=['全部',...new Set(data.skills.map(skill=>skill.category))];
      const layers=['全部',...new Set(data.skills.map(skill=>layerLabels[skill.layer]||skill.layer))];
      const stages=['全部',...stageLabels.filter(stage=>data.skills.some(skill=>skill.stages.includes(stage)))];
      const group=(label,values,kind)=>`<div class="filter-group"><span class="filter-label">${label}</span>${values.map(value=>`<button type="button" class="filter ${value==='全部'?'active':''}" data-kind="${kind}" data-value="${esc(value)}">${esc(value)}</button>`).join('')}</div>`;
      return `<div class="toolbar"><input class="search" id="search" type="search" placeholder="搜索能力、流程或适用场景" aria-label="搜索 Skills"><div>${group('类别',categories,'category')}${group('层次',layers,'layer')}${group('阶段',stages,'stage')}</div></div>`;
    }
    function renderHub(data){
      document.querySelector('#app').innerHTML=`${shellHeader(data)}<nav class="jump"><a href="#style">个人工作方式</a><a href="#catalog">能力目录</a><a href="#boundary">公开边界</a></nav><div class="layout"><aside class="rail"><div class="rail-card"><p class="rail-title">ON THIS PAGE</p><nav><a href="#style">01 · 工作方式</a><a href="#catalog">02 · 能力目录</a><a href="#boundary">03 · 公开边界</a></nav></div><div class="rail-card"><p class="rail-title">数据原则</p><p class="rail-note">页面只展示抽象后的能力、门禁和流程特征，不展示内部系统细节。</p></div></aside><div class="content">${renderPrinciples(data)}<section class="section" id="catalog"><div class="section-head"><h2>能力目录</h2><p>按能力类别、流程阶段和层次筛选</p></div>${renderStats(data)}${renderFilters(data)}<p class="result-line" id="result-line"></p><div class="skill-grid" id="skill-grid"></div></section><section class="section" id="boundary"><div class="section-head"><h2>公开边界</h2><p>保留方法，不复制环境</p></div><div class="panel" style="padding:20px"><div class="detail-grid"><article class="detail-card"><h3>保留</h3><ul><li>状态机、变量依赖和生命周期</li><li>证据优先、样本先行和质量门禁</li><li>未知点、失败分类和知识蒸馏</li></ul></article><article class="detail-card"><h3>不展示</h3><ul><li>真实环境、地址、账号和凭证</li><li>内部接口、业务字段和平台编号</li><li>能反推出具体系统结构的信息</li></ul></article></div></div></section></div></div>`;
      const state={category:'全部',layer:'全部',stage:'全部',query:''};
      const layerName=skill=>layerLabels[skill.layer]||skill.layer;
      const update=()=>{const visible=data.skills.filter(skill=>(state.category==='全部'||skill.category===state.category)&&(state.layer==='全部'||layerName(skill)===state.layer)&&(state.stage==='全部'||skill.stages.includes(state.stage))&&(!state.query||[skill.title,skill.subtitle,skill.essence,skill.category,skill.stages.join(' ')].join(' ').toLowerCase().includes(state.query.toLowerCase())));document.querySelector('#result-line').textContent=`显示 ${visible.length} / ${data.skills.length} 项能力`;document.querySelector('#skill-grid').innerHTML=visible.length?visible.map(renderCard).join(''):'<div class="empty">没有匹配的 Skill。</div>';};
      document.querySelectorAll('.filter').forEach(button=>button.addEventListener('click',()=>{const kind=button.dataset.kind;state[kind]=button.dataset.value;document.querySelectorAll(`.filter[data-kind="${kind}"]`).forEach(item=>item.classList.toggle('active',item.dataset.value===state[kind]));update()}));
      document.querySelector('#search').addEventListener('input',event=>{state.query=event.target.value.trim();update()});
      update();
    }
    function detailBlock(title,items){return `<article class="detail-card"><h3>${esc(title)}</h3><ul>${list(items)}</ul></article>`;}
    function renderDetail(data,skill){
      const related=(skill.links||[]).map(id=>skillById(data.skills,id)).filter(Boolean);
      document.querySelector('#app').innerHTML=`${shellHeader(data,skill)}<div class="layout" id="detail"><aside class="rail"><div class="rail-card"><p class="rail-title">SKILL MAP</p><nav><a href="#workflow">01 · 工作流</a><a href="#checks">02 · 门禁与边界</a><a href="#transfer">03 · 迁移方式</a></nav></div><div class="rail-card"><p class="rail-title">层次</p><p class="rail-note">${esc(layerLabels[skill.layer]||skill.layer)}</p></div></aside><div class="content"><section class="section" id="workflow"><div class="section-head"><h2>工作流</h2><p>${esc(skill.essence)}</p></div><div class="workflow">${skill.workflow.map(item=>`<article class="workflow-step"><div class="workflow-num">${esc(item.step)}</div><h3>${esc(item.title)}</h3><p>${esc(item.description)}</p></article>`).join('')}</div></section><section class="section" id="checks"><div class="section-head"><h2>执行边界</h2><p>先确认，再放大</p></div><div class="detail-grid">${detailBlock('门禁',skill.gates)}${detailBlock('未知点处理',skill.unknownHandling)}${detailBlock('失败恢复',skill.failureRecovery)}${detailBlock('交付物',skill.deliverables)}${detailBlock('反模式',skill.antiPatterns)}</div></section><section class="section" id="transfer"><div class="section-head"><h2>如何迁移</h2><p>能力可以迁移，环境不必复制</p></div><div class="detail-grid"><article class="detail-card wide"><h3>可迁移边界</h3><p class="plain">${esc(skill.transferability)}</p></article><article class="detail-card"><h3>个人工作方式</h3><ul>${list(skill.personalWorkStyle)}</ul></article><article class="detail-card"><h3>关联能力</h3><div class="related">${related.length?related.map(item=>`<a href="?skill=${encodeURIComponent(item.id)}#detail">${esc(item.title)}</a>`).join(''):'<span class="plain">暂无关联能力</span>'}</div></article></div></section></div></div>`;
    }
    load('../../data/skills-index.json').then(data=>{const selectedId=new URLSearchParams(location.search).get('skill');const selected=selectedId?skillById(data.skills,selectedId):null;if(selected)renderDetail(data,selected);else renderHub(data)}).catch(error=>{document.querySelector('#app').innerHTML=`<div class="empty" style="margin-top:24px">Skills 事实源读取失败：${esc(error.message)}</div>`});
  </script>
</body>
</html>
