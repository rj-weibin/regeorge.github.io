<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅读记录</title>
<style>
:root {
  --bg: #f5f4f0;
  --card: #fff;
  --border: #e5e3dc;
  --border2: #d0cec5;
  --text: #1a1916;
  --text2: #5a5750;
  --text3: #9a9790;
  --accent: #b16b43;
  --accent-light: rgba(177,107,67,.1);
  --r: 8px;
  --r2: 12px;
  --shadow: 0 4px 14px rgba(0,0,0,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang SC','Hiragino Sans GB',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh}

/* ── topbar ── */
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100}
.topbar>*{line-height:1}
.back-link{color:var(--text3);text-decoration:none;font-size:13px;display:inline-flex;align-items:center;gap:4px;flex-shrink:0;line-height:1;white-space:nowrap}
.back-link svg{display:block;flex-shrink:0}
.back-link:hover{color:var(--text)}
.topbar-sep{color:var(--border2);line-height:1;user-select:none}
.topbar-title{font-size:15px;font-weight:600;color:var(--text);line-height:1;white-space:nowrap}
.topbar-sub{font-size:12px;color:var(--text3);margin-left:2px;line-height:1}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.search-input{border:1px solid var(--border2);border-radius:var(--r);padding:5px 12px;font-size:13px;background:var(--bg);color:var(--text);width:160px}
.search-input:focus{outline:none;border-color:var(--accent);background:#fff}

/* ── layout ── */
.shell{display:flex;height:calc(100vh - 52px)}
.sidebar{width:200px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);overflow-y:auto}
.main{flex:1;min-width:0;overflow-y:auto}
.right-panel{width:220px;flex-shrink:0;background:#fff;border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}

/* ── sidebar ── */
.sid-section{padding:10px 12px 4px;font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--text3)}
.cluster-item{padding:9px 12px;cursor:pointer;border-left:2px solid transparent;transition:all .12s;border-bottom:.5px solid var(--border)}
.cluster-item:hover{background:var(--bg)}
.cluster-item.active{border-left-color:var(--accent);background:var(--accent-light)}
.ci-name{font-size:13px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:6px}
.cluster-item.dimmed{opacity:.42}
.ci-hit{margin-left:auto;font-size:10px;font-weight:600;color:#fff;background:var(--accent);border-radius:99px;padding:1px 7px}
.ci-hit.zero{background:var(--border2);color:var(--text3)}
.ci-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ci-count{font-size:11px;color:var(--text3);margin-top:2px}
.ci-prog-row{display:flex;align-items:center;gap:5px;margin-top:4px}
.ci-prog-bg{flex:1;height:3px;background:var(--border);border-radius:99px;overflow:hidden;position:relative}
.ci-prog-fill{height:100%;border-radius:99px;position:absolute;left:0;top:0}
.ci-prog-fill.soft{opacity:.3}
.ci-prog-fill.solid{opacity:1}
.ci-prog-txt{font-size:9px;color:var(--text3);min-width:22px;text-align:right}

/* ── main area ── */
.cluster-header{padding:18px 20px 12px;border-bottom:1px solid var(--border);background:#fff;position:sticky;top:0;z-index:10}
.ch-top{display:flex;align-items:flex-start;gap:12px}
.ch-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;margin-top:3px}
.ch-name{font-size:18px;font-weight:600;color:var(--text)}
.ch-desc{font-size:13px;color:var(--text2);margin-top:4px;line-height:1.6}
.ch-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ch-tag{font-size:11px;padding:2px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--border2);color:var(--text3)}
.ch-stats{display:flex;gap:16px;margin-top:10px;font-size:12px;color:var(--text3)}
.ch-stat strong{color:var(--text2);font-weight:600}

.books-area{padding:16px 20px}
.books-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}

/* ── 状态分组 ── */
.grp+.grp{margin-top:22px}
.grp-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;user-select:none}
.grp-head[role=button]{cursor:pointer}
.grp-head[role=button]:hover .grp-toggle{color:var(--accent);border-color:var(--accent)}
.grp-label{font-size:13px;font-weight:600;color:var(--text)}
.grp-count{font-size:11px;color:var(--text2);background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:1px 8px}
.grp-hint{font-size:11px;color:var(--text3)}
.grp-toggle{margin-left:auto;font-size:11px;color:var(--text3);border:1px solid var(--border2);border-radius:var(--r);padding:2px 9px;transition:all .12s;white-space:nowrap}

/* ── 未读紧凑行 ── */
.books-list{border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;background:var(--card)}
.book-row{display:flex;align-items:center;gap:9px;padding:8px 12px;border-bottom:1px solid var(--border);transition:background .12s}
.book-row:last-child{border-bottom:none}
.book-row:hover{background:var(--bg)}
.br-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.br-title{font-size:12.5px;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br-author{font-size:11px;color:var(--text3);flex-shrink:0;max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── 在读进度 ── */
.bc-prog{display:flex;align-items:center;gap:6px;margin-bottom:9px}
.bc-prog-bg{flex:1;height:4px;background:var(--border);border-radius:99px;overflow:hidden}
.bc-prog-fill{height:100%;border-radius:99px;background:#0c447c}
.bc-prog span{font-size:10px;color:var(--text3)}

/* ── 搜索高亮 / 作者退化 ── */
mark{background:rgba(177,107,67,.22);color:inherit;border-radius:2px;padding:0 1px}
.by-alt{color:var(--text3);font-style:italic}
.book-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;transition:border-color .15s,box-shadow .15s}
.book-card:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.bc-cover{height:6px;flex-shrink:0}
.bc-body{padding:12px}
.bc-title{font-size:13px;font-weight:600;color:var(--text);line-height:1.4;margin-bottom:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bc-author{font-size:11px;color:var(--text3);margin-bottom:8px}
.bc-thesis{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bc-thesis.empty{color:var(--text3);font-style:italic}
.bc-footer{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bc-status{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500}
.bc-status.done{background:#eaf3de;color:#27500a}
.bc-status.reading{background:#e6f1fb;color:#0c447c}
.bc-status.unread{background:var(--bg);color:var(--text3);border:1px solid var(--border2)}
.bc-notes{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:3px}
.bc-study-btn{margin-left:auto;font-size:11px;padding:3px 10px;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg);color:var(--text2);cursor:pointer;text-decoration:none;transition:all .12s;white-space:nowrap}
.bc-study-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.bc-study-btn.disabled{opacity:.4;pointer-events:none}

/* ── empty ── */
.empty-hint{padding:40px 20px;text-align:center;color:var(--text3);font-size:13px}

/* ── right panel ── */
.rp-section{padding:14px 14px 10px;border-bottom:1px solid var(--border)}
.rp-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);margin-bottom:8px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat-card{background:var(--bg);border-radius:var(--r);padding:8px;text-align:center}
.stat-n{font-size:22px;font-weight:600;color:var(--text)}
.stat-l{font-size:10px;color:var(--text3);margin-top:1px}
.gp-caption{font-size:10px;color:var(--text3);margin-top:10px}
.global-prog-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.gp-bg{flex:1;height:5px;background:var(--border);border-radius:99px;overflow:hidden}
.gp-fill{height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.gp-txt{font-size:11px;color:var(--text3);white-space:nowrap}

.prompt-section{padding:14px;flex:1;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.prompt-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px}
.prompt-card.auto{background:var(--accent-light);border-color:rgba(177,107,67,.28)}
.prompt-card.auto .prompt-text{color:var(--text2)}
.prompt-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.prompt-text{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:6px}
.copy-btn{font-size:11px;padding:3px 10px;border-radius:5px;border:1px solid var(--border2);background:#fff;color:var(--text2);cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:4px}
.copy-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.copy-btn.copied{background:#27500a;color:#fff;border-color:#27500a}

/* ── global prog bar ── */
.global-bar{height:3px;background:var(--border);position:fixed;top:52px;left:0;right:0;z-index:99}
.global-bar-fill{height:100%;background:var(--accent);transition:width .5s}

/* ── mobile hamburger ── */
.hamburger{display:none;flex-shrink:0;background:none;border:none;cursor:pointer;padding:4px;color:var(--text3);margin-left:-4px}
.hamburger:hover{color:var(--text)}
.hamburger svg{display:block}

/* ── sidebar overlay ── */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:99;opacity:0;transition:opacity .2s}
.sidebar-overlay.open{opacity:1}

/* ── mobile stats area ── */
.mobile-stats{display:none}

/* ── drawer handle / overlay（仅移动端可见） ── */
.rp-handle{display:none}
.panel-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:89;opacity:0;transition:opacity .2s}
.panel-overlay.open{opacity:1}
.rpt-badge{display:none}

/* ── responsive ── */
@media(max-width:768px){
  .hamburger{display:flex;align-items:center;justify-content:center}

  .sidebar-overlay{display:block;pointer-events:none}
  .sidebar-overlay.open{pointer-events:auto}

  .sidebar{position:fixed;top:52px;left:0;bottom:0;z-index:100;width:240px;transform:translateX(-100%);transition:transform .25s ease;box-shadow:2px 0 20px rgba(0,0,0,.12);max-height:none}
  .sidebar.open{transform:translateX(0)}

  .right-panel{display:block;position:fixed;bottom:0;left:0;right:0;z-index:90;background:#fff;border-top:2px solid var(--accent);border-radius:16px 16px 0 0;max-height:78vh;overflow-y:auto;width:100%;box-shadow:0 -4px 24px rgba(0,0,0,.14);transition:transform .25s ease;transform:translateY(100%);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .right-panel.open{transform:translateY(0)}
  .right-panel-toggle{display:flex;position:fixed;bottom:16px;right:16px;z-index:91;width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;align-items:center;justify-content:center;font-size:19px;cursor:pointer;box-shadow:0 4px 16px rgba(177,107,67,.35);border:none}
  .right-panel-toggle:active{transform:scale(.94)}

  .panel-overlay{display:block;pointer-events:none}
  .panel-overlay.open{pointer-events:auto}

  /* 抽屉顶部把手：可点击收起，且是滚动时的粘性锚点 */
  .rp-handle{display:flex;justify-content:center;padding:9px 0 7px;position:sticky;top:0;background:#fff;z-index:2;cursor:pointer;border-radius:16px 16px 0 0}
  .rp-handle-bar{width:38px;height:4px;border-radius:99px;background:var(--border2)}

  /* 抽屉里整体进度做成一行，把空间让给提示词 */
  .right-panel .rp-section{padding:4px 14px 12px}
  .right-panel .prompt-section{padding:12px 14px calc(20px + env(safe-area-inset-bottom))}
  .prompt-card{margin-bottom:8px}

  /* 有动态提示词时在按钮上打角标 */
  .rpt-badge{display:block;position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;line-height:18px;border-radius:99px;background:#27500a;color:#fff;font-size:10px;font-weight:600;text-align:center;padding:0 4px;box-shadow:0 0 0 2px #fff}
  .rpt-badge:empty{display:none}
  .right-panel-toggle{position:fixed}

  .main{width:100%;overflow-y:auto}

  .mobile-stats{display:block;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--bg)}
  .ms-section{padding:14px 0}
  .ms-section+.ms-section{border-top:1px solid var(--border)}
  .ms-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);margin-bottom:8px}
  .ms-stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .ms-stat-card{background:#fff;border-radius:var(--r);padding:8px 4px;text-align:center;border:1px solid var(--border)}
  .ms-stat-n{font-size:18px;font-weight:600;color:var(--text)}
  .ms-stat-l{font-size:9px;color:var(--text3);margin-top:1px}
  .ms-prog-row{display:flex;align-items:center;gap:8px;margin-top:8px}
  .ms-prog-bg{flex:1;height:5px;background:var(--border);border-radius:99px;overflow:hidden}
  .ms-prog-fill{height:100%;border-radius:99px;background:var(--accent)}
  .ms-prog-txt{font-size:11px;color:var(--text3);white-space:nowrap}

  .topbar{padding:0 10px;gap:8px}
  .topbar-title{font-size:13px}
  .topbar-sub{display:none}
  .topbar-right{flex:1;min-width:0}
  .search-input{width:100%;font-size:13px}

  .cluster-header{padding:14px 12px 10px}
  .ch-name{font-size:16px}
  .ch-desc{font-size:12px}
  .ch-stats{gap:10px;font-size:11px}
  .books-area{padding:12px}
  .books-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .bc-body{padding:10px}
  .bc-title{font-size:12px}
  .bc-author{font-size:10px}
  .bc-thesis{font-size:11px;-webkit-line-clamp:2}
  .grp+.grp{margin-top:18px}
  .grp-hint{display:none}
  .book-row{padding:9px 10px;gap:7px}
  .br-title{font-size:12px}
  .br-author{font-size:10px;max-width:30%}

  .prompt-card{background:var(--bg)}
  .prompt-card.auto{background:var(--accent-light)}
}
</style>

// ── 状态 ──────────────────────────────────────────────────
var allBooks = (window.READING_SHELF_BOOKS || []).filter(dedup);
var curClusterId = null;
var searchQ = '';
var unreadOpen = false; // 待读组默认折叠

function dedup(b, idx, arr) {
  // 去重：同 title 只保留第一个
  return arr.findIndex(function(x){ return x.title === b.title; }) === idx;
}

function getProgress(b) {
  return Math.max(0, Math.min(100, Number(b.progress) || 0));
}

function getStatus(b) {
  var p = getProgress(b);
  if (p >= 100) return 'done';
  if (p > 0) return 'reading';
  return 'unread';
}

function statusLabel(s) {
  return {done:'已读完', reading:'在读中', unread:'未读'}[s] || '未读';
}

// 给每本书打 cluster 标签：命中打分，只归入得分最高的那一个主题
// 打分规则：命中书名 3 分，命中作者 2 分，命中论点 1 分；关键词越长越具体，额外加权。
var _tagCache = {};
function tagBook(book) {
  var key = book.bookId || book.title;
  if (_tagCache[key]) return _tagCache[key];

  var title = String(book.title || '');
  var author = String(book.author || '');
  var thesis = String((book.detail || {}).thesis || '');
  if (thesis === '待补') thesis = '';

  var best = null, bestScore = 0;
  CLUSTERS.forEach(function(c) {
    if (!c.keywords.length) return;
    var score = 0;
    c.keywords.forEach(function(kw) {
      var w = Math.min(kw.length, 6) / 2; // 长关键词更具体，权重更高
      if (title.indexOf(kw) >= 0) score += 3 * w;
      else if (author.indexOf(kw) >= 0) score += 2 * w;
      else if (thesis.indexOf(kw) >= 0) score += 1 * w;
    });
    if (score > bestScore) { bestScore = score; best = c.id; }
  });

  var result = best ? [best] : ['other'];
  _tagCache[key] = result;
  return result;
}

function getBooksForCluster(cid) {
  return allBooks.filter(function(b){ return tagBook(b)[0] === cid; });
}

function applySearch(books) {
  if (!searchQ) return books;
  var q = searchQ.toLowerCase();
  return books.filter(function(b){
    var thesis = (b.detail && b.detail.thesis) || '';
    return (b.title||'').toLowerCase().indexOf(q) >= 0 ||
           (b.author||'').toLowerCase().indexOf(q) >= 0 ||
           thesis.toLowerCase().indexOf(q) >= 0;
  });
}

// ── 统计 ──────────────────────────────────────────────────
// 完成率只在"真正翻开过的书"里算（已读 + 在读），未读的收藏不拉低分母。
function summarize(books) {
  var done = 0, reading = 0, noted = 0;
  books.forEach(function(b){
    var s = getStatus(b);
    if (s === 'done') done++;
    else if (s === 'reading') reading++;
    if ((b.notes||0) > 0) noted++;
  });
  var touched = done + reading;
  return {
    total: books.length,
    done: done,
    reading: reading,
    unread: books.length - touched,
    touched: touched,
    noted: noted,
    pct: touched ? Math.round(done / touched * 100) : 0
  };
}

function renderStats() {
  var s = summarize(allBooks);
  document.getElementById('statGrid').innerHTML =
    '<div class="stat-card"><div class="stat-n">'+s.total+'</div><div class="stat-l">书架总数</div></div>'+
    '<div class="stat-card"><div class="stat-n">'+s.done+'</div><div class="stat-l">已读完</div></div>'+
    '<div class="stat-card"><div class="stat-n">'+s.reading+'</div><div class="stat-l">在读</div></div>'+
    '<div class="stat-card"><div class="stat-n">'+s.noted+'</div><div class="stat-l">有笔记</div></div>';
  document.getElementById('globalProgFill').style.width = s.pct + '%';
  document.getElementById('globalBarFill').style.width = s.pct + '%';
  document.getElementById('globalProgTxt').textContent = s.pct + '%';
  document.getElementById('globalProgTxt').title = '已读完 '+s.done+' / 翻开过 '+s.touched+' 本';
  document.getElementById('topbarSub').textContent =
    '共 ' + s.total + ' 本 · 读完 ' + s.done + ' · 在读 ' + s.reading + ' · 待读 ' + s.unread;
}

// ── sidebar ──────────────────────────────────────────────
function renderSidebar() {
  var html = '<div class="sid-section">主题分组</div>';
  CLUSTERS.forEach(function(c) {
    var books = getBooksForCluster(c.id);
    if (!books.length) return;
    var s = summarize(books);
    // 搜索时在侧栏标出各主题命中数，避免"别处有结果但看不见"
    var hits = searchQ ? applySearch(books).length : 0;
    // 侧栏进度条 = 已翻开的比例（读完实心 + 在读半透明），一眼看出"动过多少"
    var openedPct = s.total ? Math.round(s.touched / s.total * 100) : 0;
    var donePct = s.total ? Math.round(s.done / s.total * 100) : 0;
    var isActive = c.id === curClusterId;
    var meta = s.total + ' 本';
    if (s.done) meta += ' · ' + s.done + ' 读完';
    if (s.reading) meta += ' · ' + s.reading + ' 在读';
    html += '<div class="cluster-item'+(isActive?' active':'')+(searchQ&&!hits?' dimmed':'')+'" onclick="selectCluster(\''+c.id+'\')">' +
      '<div class="ci-name"><span class="ci-dot" style="background:'+c.color+'"></span>'+esc(c.name)+
      (searchQ ? '<span class="ci-hit'+(hits?'':' zero')+'">'+hits+'</span>' : '')+'</div>'+
      '<div class="ci-count">'+meta+'</div>'+
      '<div class="ci-prog-row"><div class="ci-prog-bg" title="已翻开 '+s.touched+' / '+s.total+' 本">'+
      '<div class="ci-prog-fill soft" style="width:'+openedPct+'%;background:'+c.color+'"></div>'+
      '<div class="ci-prog-fill solid" style="width:'+donePct+'%;background:'+c.color+'"></div></div>'+
      '<span class="ci-prog-txt">'+(s.noted ? '📝'+s.noted : '')+'</span></div>'+
      '</div>';
  });
  document.getElementById('sidebar').innerHTML = html;
}

// ── main area ─────────────────────────────────────────────
function renderMain() {
  var el = document.getElementById('mainArea');
  if (!curClusterId) {
    el.innerHTML = '<div class="empty-hint">← 从左侧选择一个主题</div>';
    return;
  }
  var c = CLUSTERS.find(function(x){ return x.id === curClusterId; });
  if (!c) return;
  var books = applySearch(getBooksForCluster(c.id));
  var s = summarize(books);

  var headerHtml = '<div class="cluster-header">'+
    '<div class="ch-top"><div class="ch-dot" style="background:'+c.color+'"></div>'+
    '<div><div class="ch-name">'+esc(c.name)+'</div>'+
    '<div class="ch-desc">'+esc(c.desc)+'</div></div></div>'+
    '<div class="ch-stats">'+
    '<span><strong>'+s.total+'</strong> 本书</span>'+
    (s.done ? '<span><strong>'+s.done+'</strong> 读完</span>' : '')+
    (s.reading ? '<span><strong>'+s.reading+'</strong> 在读</span>' : '')+
    (s.unread ? '<span><strong>'+s.unread+'</strong> 待读</span>' : '')+
    (s.noted ? '<span><strong>'+s.noted+'</strong> 本有笔记</span>' : '')+
    '</div></div>';

  var cardsHtml = '';
  if (!books.length) {
    cardsHtml = '<div class="empty-hint">没有匹配的书籍</div>';
  } else {
    // 按状态分组：在读 → 读完 → 待读。前两组是"正在发生的事"，待读是仓库。
    var groups = [
      { key:'reading', label:'在读', hint:'手上正在推进的', items:[] },
      { key:'done',    label:'读完', hint:'留下过痕迹的',   items:[] },
      { key:'unread',  label:'待读', hint:'书架上的库存',   items:[] }
    ];
    books.forEach(function(b){
      var g = groups.filter(function(x){ return x.key === getStatus(b); })[0];
      if (g) g.items.push(b);
    });
    // 组内排序：笔记多的优先，再按进度
    groups.forEach(function(g){
      g.items.sort(function(a,b){
        var na = a.notes||0, nb = b.notes||0;
        if (na !== nb) return nb - na;
        var pa = getProgress(a), pb = getProgress(b);
        if (pa !== pb) return pb - pa;
        return (a.title||'').localeCompare(b.title||'', 'zh');
      });
    });

    cardsHtml = '<div class="books-area">';
    groups.forEach(function(g){
      if (!g.items.length) return;
      // 待读组默认折叠（除非在搜索中，搜索时全部展开）
      var collapsible = (g.key === 'unread') && !searchQ;
      var collapsed = collapsible && !unreadOpen;
      cardsHtml += '<div class="grp'+(collapsed?' collapsed':'')+'">'+
        '<div class="grp-head"'+(collapsible?' onclick="toggleUnread()" role="button" tabindex="0"':'')+'>'+
        '<span class="grp-label">'+g.label+'</span>'+
        '<span class="grp-count">'+g.items.length+'</span>'+
        '<span class="grp-hint">'+g.hint+'</span>'+
        (collapsible ? '<span class="grp-toggle">'+(collapsed?'展开 ▾':'收起 ▴')+'</span>' : '')+
        '</div>';
      if (!collapsed) {
        cardsHtml += (g.key === 'unread')
          ? '<div class="books-list">' + g.items.map(compactRow).join('') + '</div>'
          : '<div class="books-grid">' + g.items.map(fullCard).join('') + '</div>';
      }
      cardsHtml += '</div>';
    });
    cardsHtml += '</div>';
  }
  el.innerHTML = headerHtml + cardsHtml;
}

// 完整卡片：给在读 / 读完的书，信息密度高
function fullCard(b) {
  var s = getStatus(b);
  var prog = getProgress(b);
  var thesis = (b.detail && b.detail.thesis && b.detail.thesis !== '待补') ? b.detail.thesis : '';
  var hasStudy = (b.notes||0) > 0 || thesis;
  var studyHref = 'reading-study.html?bookId=' + encodeURIComponent(b.bookId || b.title);
  var colorStart = (b.theme && b.theme[0]) ? b.theme[0] : '#ccc';
  var colorEnd = (b.theme && b.theme[1]) ? b.theme[1] : '#999';
  return '<div class="book-card">'+
    '<div class="bc-cover" style="background:linear-gradient(90deg,'+colorStart+','+colorEnd+')"></div>'+
    '<div class="bc-body">'+
    '<div class="bc-title">'+hl(b.title)+'</div>'+
    '<div class="bc-author">'+byline(b)+'</div>'+
    (thesis ? '<div class="bc-thesis">'+esc(thesis)+'</div>' : '<div class="bc-thesis empty">暂无核心论点记录</div>')+
    (s === 'reading' ? '<div class="bc-prog"><div class="bc-prog-bg"><div class="bc-prog-fill" style="width:'+prog+'%"></div></div><span>'+prog+'%</span></div>' : '')+
    '<div class="bc-footer">'+
    '<span class="bc-status '+s+'">'+statusLabel(s)+'</span>'+
    ((b.notes||0)>0 ? '<span class="bc-notes">📝 '+b.notes+'</span>' : '')+
    '<a class="bc-study-btn'+(hasStudy?'':' disabled')+'" href="'+(hasStudy?studyHref:'#')+'">记录 →</a>'+
    '</div></div></div>';
}

// 紧凑行：给未读的书，一行一本，不占视觉预算
function compactRow(b) {
  var colorStart = (b.theme && b.theme[0]) ? b.theme[0] : '#ccc';
  return '<div class="book-row">'+
    '<span class="br-dot" style="background:'+colorStart+'"></span>'+
    '<span class="br-title">'+hl(b.title)+'</span>'+
    '<span class="br-author">'+byline(b)+'</span>'+
    '</div>';
}

// 作者缺失时退化到出版方，不显示空白；"微信读书"是同步来源不是作者，不当作退化值
var PLACEHOLDER_AUTHORS = ['待补','未知作者','Unknown','unknown','佚名',''];
var GENERIC_SOURCES = ['微信读书','CTCCN','待补','Obsidian'];
function byline(b) {
  var a = (b.author||'').trim();
  if (PLACEHOLDER_AUTHORS.indexOf(a) < 0) return hl(a);
  var alt = (b.publisher||'').trim();
  if (!alt || GENERIC_SOURCES.indexOf(alt) >= 0) alt = '';
  return alt ? '<span class="by-alt">'+esc(alt)+'</span>' : '<span class="by-alt">作者待补</span>';
}

// 搜索命中高亮
function hl(text) {
  var safe = esc(text || '');
  if (!searchQ) return safe;
  var q = esc(searchQ);
  var i = safe.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return safe;
  return safe.slice(0, i) + '<mark>' + safe.slice(i, i + q.length) + '</mark>' + safe.slice(i + q.length);
}

function toggleUnread() {
  unreadOpen = !unreadOpen;
  renderMain();
}

// ── 动态提示词：引用真实的论点 / 原话 / 碰撞，而不是只拼书名 ──
function buildAutoPrompts(c) {
  var books = getBooksForCluster(c.id).filter(function(b){ return getStatus(b) !== 'unread'; });
  if (!books.length) return [];

  var titles = books.map(function(b){ return '《'+b.title+'》'; });
  var out = [];

  // 1) 有实质笔记的书 —— 用真实论点做素材，AI 才能接得住
  var withThesis = books.filter(function(b){
    var t = (b.detail||{}).thesis || '';
    return t && t !== '待补' && t !== '待迁移';
  });
  if (withThesis.length >= 2) {
    var material = withThesis.map(function(b){
      return '《'+b.title+'》：'+(b.detail.thesis);
    }).join('\n');
    out.push({
      label: '✦ 用我的论点交叉',
      hint: '引用你为 '+withThesis.length+' 本书写下的核心论点',
      text: '这是我在"'+c.name+'"方向读过的书，以及我为每本记下的核心论点：\n\n'+material+
        '\n\n请帮我：1) 找出这些论点之间真正的共鸣与冲突（不要泛泛而谈）；2) 指出我可能存在的认知盲区；3) 给出一个能把它们整合起来的框架。'
    });
  }

  // 2) 用户自己的原话 —— 最有价值的素材，不要被书评语言覆盖
  var withVoice = books.filter(function(b){ return ((b.detail||{}).originalFeeling||'').length > 20; });
  if (withVoice.length) {
    var voices = withVoice.map(function(b){
      var v = b.detail.originalFeeling;
      return '读《'+b.title+'》时我写下：\n"'+(v.length > 220 ? v.slice(0,220)+'…' : v)+'"';
    }).join('\n\n');
    out.push({
      label: '✦ 顺着我的原话追问',
      hint: '基于你写下的 '+withVoice.length+' 段真实感受',
      text: voices + '\n\n请不要重复我说过的话，也不要用书里的语言替换我的表达。请顺着我这些原话往下追问：我真正在意的是什么？我还没说出口的那一层是什么？给我 3 个能让我继续想下去的问题。'
    });
  }

  // 3) 已有碰撞 —— 把已经建立的连接再推一步
  var withCollisions = books.filter(function(b){ return (((b.detail||{}).collisions)||[]).length > 0; });
  if (withCollisions.length >= 2) {
    var links = [];
    withCollisions.forEach(function(b){
      (b.detail.collisions || []).slice(0, 3).forEach(function(x){
        var label = (typeof x === 'string') ? x : (x && (x.title || x.name || x.summary));
        if (label) links.push('《'+b.title+'》→ '+label);
      });
    });
    if (links.length >= 3) {
      out.push({
        label: '✦ 把已有碰撞再推一步',
        hint: '基于你已记录的 '+links.length+' 条连接',
        text: '我在"'+c.name+'"方向已经建立了这些碰撞连接：\n\n'+links.slice(0,12).join('\n')+
          '\n\n请帮我看：这些连接里哪几条其实指向同一个更底层的原则？还有哪条明显的连接是我漏掉的？'
      });
    }
  }

  // 4) 兜底 —— 只有书名可用时
  if (!out.length && books.length >= 2) {
    out.push({
      label: '✦ 动态生成',
      hint: '基于此主题下 '+books.length+' 本已翻开的书',
      text: '我在"'+c.name+'"方向读过：'+titles.join('、')+
        '。请帮我梳理这些书的核心共同主题，找出最深刻的洞见，并推荐 2 本能深化理解的进阶书目。'
    });
  }

  // 5) 待读推荐 —— 让库存变成决策入口
  var unread = getBooksForCluster(c.id).filter(function(b){ return getStatus(b) === 'unread'; });
  if (unread.length >= 3 && books.length) {
    out.push({
      label: '✦ 下一本读哪个',
      hint: '从 '+unread.length+' 本待读里挑',
      text: '我在"'+c.name+'"方向已经读过：'+titles.slice(0,12).join('、')+
        '。\n\n书架上还有这些没读：'+unread.slice(0,25).map(function(b){ return '《'+b.title+'》'; }).join('、')+
        '。\n\n请结合我已读的内容，从待读清单里挑出 3 本最该先读的，并说明每一本能补上我现有认知的哪个缺口。'
    });
  }

  return out;
}

function promptCardHtml(p, isAuto, extraStyle) {
  var full = p.text;
  var preview = isAuto && p.hint ? p.hint : (full.slice(0,100) + (full.length>100?'…':''));
  return '<div class="prompt-card'+(isAuto?' auto':'')+'"'+(extraStyle?' style="'+extraStyle+'"':'')+'>'+
    '<div class="prompt-label"'+(isAuto?' style="color:var(--accent)"':'')+'>'+esc(p.label)+'</div>'+
    '<div class="prompt-text">'+esc(preview)+'</div>'+
    '<button class="copy-btn" onclick="copyPrompt(this,\''+esc(full).replace(/'/g,'&#39;').replace(/\n/g,'&#10;')+'\')">'+
    '📋 复制提示词</button></div>';
}

// ── right panel prompts ───────────────────────────────────
function renderPrompts() {
  var el = document.getElementById('promptSection');
  var c = curClusterId ? CLUSTERS.find(function(x){ return x.id === curClusterId; }) : null;
  if (!c) {
    el.innerHTML = '<div class="rp-label">AI 探索提示词</div>'+
      '<div style="font-size:12px;color:var(--text3)">选择主题后会出现可复制的提示词</div>';
    return;
  }
  var html = '<div class="rp-label">AI 探索提示词</div>';
  // 动态的放前面：它们引用你真实写下的东西
  buildAutoPrompts(c).forEach(function(p){ html += promptCardHtml(p, true); });
  (c.prompts || []).forEach(function(p){ html += promptCardHtml(p, false); });
  el.innerHTML = html;
}

// ── sidebar toggle (mobile) ──────────────────────────────
function toggleSidebar() {
  var sb = document.getElementById('sidebar');
  var ov = document.getElementById('sidebarOverlay');
  var open = sb.classList.toggle('open');
  ov.classList.toggle('open');
  document.body.style.overflow = open ? 'hidden' : '';
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

// ── mobile render ────────────────────────────────────────
function renderMobileStats() {
  var el = document.getElementById('mobileStats');
  if (!el || window.innerWidth > 768) { el && (el.innerHTML = ''); return; }
  var s = summarize(allBooks);
  el.innerHTML =
    '<div class="ms-section">'+
    '<div class="ms-label">整体进度</div>'+
    '<div class="ms-stat-grid">'+
    '<div class="ms-stat-card"><div class="ms-stat-n">'+s.total+'</div><div class="ms-stat-l">总数</div></div>'+
    '<div class="ms-stat-card"><div class="ms-stat-n">'+s.done+'</div><div class="ms-stat-l">读完</div></div>'+
    '<div class="ms-stat-card"><div class="ms-stat-n">'+s.reading+'</div><div class="ms-stat-l">在读</div></div>'+
    '<div class="ms-stat-card"><div class="ms-stat-n">'+s.noted+'</div><div class="ms-stat-l">有笔记</div></div>'+
    '</div>'+
    '<div class="ms-prog-row">'+
    '<div class="ms-prog-bg"><div class="ms-prog-fill" style="width:'+s.pct+'%"></div></div>'+
    '<span class="ms-prog-txt">'+s.pct+'% 读完</span></div>'+
    '</div>';
}

function selectCluster(id) {
  curClusterId = id;
  unreadOpen = false; // 换主题时重新折叠待读
  closeSidebar();
  render();
}

function onSearch() {
  searchQ = document.getElementById('searchInput').value.trim();
  render();
}

function copyPrompt(btn, text) {
  // HTML entities back to real text
  var tmp = document.createElement('textarea');
  tmp.innerHTML = text;
  var decoded = tmp.value;
  navigator.clipboard.writeText(decoded).then(function(){
    btn.classList.add('copied');
    btn.textContent = '✓ 已复制';
    setTimeout(function(){ btn.classList.remove('copied'); btn.textContent = '📋 复制提示词'; }, 2000);
  }).catch(function(){
    // fallback
    var ta = document.createElement('textarea');
    ta.value = decoded;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    btn.textContent = '✓ 已复制';
    setTimeout(function(){ btn.textContent = '📋 复制提示词'; }, 2000);
  });
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render() {
  renderStats();
  renderSidebar();
  renderMain();
  renderPrompts();
  renderPromptBadge();
  renderMobileStats();
}

// 默认选中第一个有书的 cluster
function init() {
  for (var i = 0; i < CLUSTERS.length; i++) {
    if (getBooksForCluster(CLUSTERS[i].id).length > 0) {
      curClusterId = CLUSTERS[i].id;
      break;
    }
  }
  render();
}

init();

function toggleRightPanel() {
  var panel = document.getElementById('rightPanel');
  var ov = document.getElementById('panelOverlay');
  if (!panel) return;
  var open = panel.classList.toggle('open');
  if (ov) ov.classList.toggle('open', open);
  document.body.style.overflow = open ? 'hidden' : '';
  if (open) panel.scrollTop = 0;
}

function closeRightPanel() {
  var panel = document.getElementById('rightPanel');
  var ov = document.getElementById('panelOverlay');
  if (panel) panel.classList.remove('open');
  if (ov) ov.classList.remove('open');
  document.body.style.overflow = '';
}

// 抽屉按钮角标：提示当前主题有几条动态提示词
function renderPromptBadge() {
  var el = document.getElementById('rptBadge');
  if (!el) return;
  var c = curClusterId ? CLUSTERS.find(function(x){ return x.id === curClusterId; }) : null;
  var n = c ? buildAutoPrompts(c).length : 0;
  el.textContent = n ? String(n) : '';
}

// Esc 关闭抽屉和侧栏
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') { closeRightPanel(); closeSidebar(); }
});
</script>
