<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="从 IP 是用户心智里的永久货架出发，用 FY2025 经营数据检验泡泡玛特、腾讯、小米和茅台。">
  <title>情绪价值能被量化吗？ · reGeorge</title>
  <link rel="stylesheet" href="../../assets/site-chrome.css">
  <style>
    :root {
      --bg: #eeece5;
      --paper: #fffef9;
      --ink: #20201d;
      --muted: #6f6c65;
      --subtle: #969188;
      --line: #d0ccc2;
      --line-strong: #918c82;
      --green: #176b60;
      --green-soft: #dcece7;
      --pink: #c93672;
      --pink-soft: #f5dce6;
      --blue: #1672b8;
      --orange: #e45b20;
      --red: #9d3034;
      --gold: #b67a18;
      --display: "Iowan Old Style", "Noto Serif SC", "Songti SC", STSong, Georgia, serif;
      --sans: Aptos, "Noto Sans SC", "Microsoft YaHei", sans-serif;
      --mono: "Cascadia Code", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body.site-page.site-research {
      margin: 0;
      color: var(--ink) !important;
      background-color: var(--bg) !important;
      background-image: linear-gradient(rgba(32, 32, 29, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(32, 32, 29, .035) 1px, transparent 1px) !important;
      background-size: 80px 80px !important;
      font-family: var(--sans) !important;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    a { color: inherit; }
    h1, h2, h3, p, td, th { overflow-wrap: anywhere; }
    .shell { width: min(1360px, calc(100% - 40px)); margin: 0 auto; }
    .topbar {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line-strong);
      color: var(--muted);
      font-size: 13px;
    }
    .topbar a { text-decoration: none; }
    .topbar a:hover { color: var(--pink); }
    .brand { color: var(--ink); font-family: var(--display); font-size: 16px; font-weight: 700; }
    .loading { min-height: 70vh; display: grid; place-items: center; color: var(--muted); }

    .hero {
      min-height: 670px;
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(380px, .85fr);
      align-items: center;
      gap: 72px;
      padding: 74px 0 64px;
      border-bottom: 1px solid var(--line-strong);
    }
    .eyebrow, .section-kicker, .micro-label {
      margin: 0;
      color: var(--green);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }
    h1 {
      max-width: 760px;
      margin: 18px 0 24px;
      font-family: var(--display);
      font-size: 62px;
      line-height: 1.08;
      letter-spacing: 0;
    }
    .research-question { max-width: 760px; margin: 0; color: var(--muted); font-size: 18px; line-height: 1.9; }
    .origin {
      max-width: 760px;
      margin-top: 34px;
      padding: 20px 0 0 20px;
      border-top: 1px solid var(--line);
      border-left: 5px solid var(--pink);
    }
    .origin .micro-label { color: var(--pink); }
    .origin blockquote { margin: 10px 0 0; font-family: var(--display); font-size: 19px; line-height: 1.65; }
    .origin blockquote span { display: block; }
    .origin blockquote span:last-child { margin-top: 7px; font-weight: 700; }
    .verdict-panel { padding: 34px 0 34px 32px; border-left: 1px solid var(--line-strong); }
    .status-row { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 6px rgba(182, 122, 24, .13); }
    .status-label { color: var(--gold); font-size: 12px; font-weight: 800; }
    .verdict-panel h2 { margin: 0 0 18px; font-family: var(--display); font-size: 31px; line-height: 1.3; }
    .verdict-panel p { margin: 0; color: var(--muted); font-size: 15px; }
    .verdict-boundary { margin-top: 22px !important; padding-top: 18px; border-top: 1px solid var(--line); color: var(--ink) !important; font-size: 13px !important; }

    .headline-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border-bottom: 1px solid var(--line-strong);
    }
    .headline-metric { min-height: 195px; padding: 26px 24px 22px 0; border-right: 1px solid var(--line); }
    .headline-metric + .headline-metric { padding-left: 24px; }
    .headline-metric:last-child { border-right: 0; }
    .metric-label { color: var(--muted); font-size: 12px; font-weight: 700; }
    .metric-value { display: block; margin: 9px 0 2px; font-family: var(--display); font-size: 38px; line-height: 1.1; }
    .metric-delta { color: var(--green); font-family: var(--mono); font-size: 12px; font-weight: 700; }
    .metric-delta.risk { color: var(--red); }
    .metric-detail { min-height: 42px; margin: 14px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .citations { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
    .citation {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 7px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--muted);
      background: rgba(255, 254, 249, .72);
      font-family: var(--mono);
      font-size: 10px;
      text-decoration: none;
    }
    .citation:hover { border-color: var(--green); color: var(--green); }

    .section { padding: 82px 0; border-bottom: 1px solid var(--line-strong); }
    .section-head { display: grid; grid-template-columns: minmax(0, .85fr) minmax(360px, 1.15fr); gap: 64px; align-items: end; margin-bottom: 42px; }
    .section-head h2 { margin: 9px 0 0; font-family: var(--display); font-size: 40px; line-height: 1.2; }
    .section-head p { margin: 0; color: var(--muted); font-size: 15px; }

    .method-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 4px solid var(--ink); }
    .method-step { min-height: 280px; padding: 22px 20px 20px 0; border-right: 1px solid var(--line); }
    .method-step + .method-step { padding-left: 20px; }
    .method-step:last-child { border-right: 0; }
    .method-number { color: var(--subtle); font-family: var(--mono); font-size: 11px; }
    .method-step h3 { margin: 34px 0 10px; font-family: var(--display); font-size: 21px; }
    .method-question { min-height: 72px; margin: 0; font-size: 14px; }
    .method-proxy { margin: 20px 0 0; color: var(--green); font-size: 12px; font-weight: 700; }
    .method-limit { margin: 8px 0 0; color: var(--muted); font-size: 11px; line-height: 1.55; }

    .audit-list { border-top: 4px solid var(--pink); }
    .audit-row {
      display: grid;
      grid-template-columns: 180px minmax(0, 1.05fr) minmax(0, .95fr);
      gap: 32px;
      padding: 28px 0;
      border-bottom: 1px solid var(--line);
    }
    .audit-row h3 { margin: 10px 0 8px; font-family: var(--display); font-size: 20px; line-height: 1.35; }
    .audit-strength { color: var(--subtle); font-size: 11px; }
    .verdict-chip { display: inline-flex; min-height: 25px; align-items: center; padding: 2px 8px; border: 1px solid var(--green); border-radius: 4px; color: var(--green); font-size: 11px; font-weight: 800; }
    .audit-row.mixed .verdict-chip { border-color: var(--gold); color: var(--gold); }
    .audit-row.risk .verdict-chip { border-color: var(--red); color: var(--red); }
    .audit-finding { margin: 0; font-size: 16px; }
    .audit-interpretation { margin: 14px 0 0; color: var(--green); font-size: 13px; font-weight: 700; }
    .alternative { padding-left: 22px; border-left: 1px solid var(--line-strong); }
    .alternative .micro-label { color: var(--red); }
    .alternative p { margin: 10px 0 0; color: var(--muted); font-size: 13px; }

    .chart-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 54px; }
    .chart-panel { min-height: 390px; padding: 24px; border: 1px solid var(--line-strong); background: rgba(255, 254, 249, .76); }
    .chart-panel h3 { margin: 0; font-family: var(--display); font-size: 21px; }
    .chart-subtitle { margin: 2px 0 22px; color: var(--muted); font-size: 11px; }
    .series-group { margin-bottom: 23px; }
    .series-name { display: flex; justify-content: space-between; margin-bottom: 7px; color: var(--muted); font-size: 11px; }
    .bar-row { display: grid; grid-template-columns: 38px minmax(0, 1fr) 58px; align-items: center; gap: 8px; margin: 7px 0; font-family: var(--mono); font-size: 10px; }
    .bar-track { height: 15px; background: #dfdcd4; }
    .bar-fill { height: 100%; min-width: 2px; background: var(--green); }
    .bar-row:last-child .bar-fill { background: var(--pink); }
    .bar-value { text-align: right; }
    .stack-row { margin-bottom: 24px; }
    .stack-year { margin-bottom: 7px; font-family: var(--mono); font-size: 11px; }
    .stack-bar { height: 32px; display: flex; overflow: hidden; border: 1px solid var(--line-strong); }
    .stack-segment { min-width: 1px; height: 100%; }
    .tone-pink { background: var(--pink); }
    .tone-blue { background: var(--blue); }
    .tone-gold { background: var(--gold); }
    .tone-teal { background: var(--green); }
    .legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px 12px; margin-top: 18px; color: var(--muted); font-size: 10px; }
    .legend-item { display: flex; align-items: center; gap: 7px; }
    .legend-swatch { width: 8px; height: 8px; flex: 0 0 8px; }

    .calculation-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 20px; border-top: 1px solid var(--line-strong); }
    .calculation { min-height: 210px; padding: 22px 20px 0 0; border-right: 1px solid var(--line); }
    .calculation + .calculation { padding-left: 20px; }
    .calculation:last-child { border-right: 0; }
    .calculation h3 { margin: 0 0 18px; font-size: 13px; }
    .formula { margin: 0 0 8px; color: var(--muted); font-family: var(--mono); font-size: 10px; }
    .calculation strong { display: block; font-family: var(--display); font-size: 30px; }
    .calculation p:last-child { margin: 12px 0 0; color: var(--muted); font-size: 11px; }

    .comparison-charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; margin-bottom: 42px; }
    .comparison-chart { padding: 24px; border-top: 4px solid var(--ink); background: rgba(255, 254, 249, .66); }
    .comparison-chart h3 { margin: 0; font-family: var(--display); font-size: 22px; }
    .comparison-chart > p { margin: 4px 0 20px; color: var(--muted); font-size: 11px; }
    .company-bar-row { display: grid; grid-template-columns: 78px minmax(0, 1fr) 62px; align-items: center; gap: 10px; margin: 14px 0; }
    .company-bar-name { font-size: 12px; font-weight: 700; }
    .paired-track { display: grid; gap: 4px; }
    .paired-line { height: 8px; background: #dedad1; }
    .paired-fill { height: 100%; background: var(--subtle); }
    .paired-line:last-child .paired-fill { background: var(--company); }
    .company-bar-value { font-family: var(--mono); font-size: 10px; text-align: right; }
    .change-down { color: var(--green); }
    .change-up { color: var(--red); }

    .table-wrap { overflow-x: auto; border-top: 1px solid var(--line-strong); }
    .evidence-table { width: 100%; min-width: 1120px; border-collapse: collapse; table-layout: fixed; }
    .evidence-table th, .evidence-table td { padding: 18px 16px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    .evidence-table th:last-child, .evidence-table td:last-child { border-right: 0; }
    .evidence-table thead th { background: var(--paper); font-family: var(--display); font-size: 18px; }
    .evidence-table thead th:first-child { width: 170px; font-family: var(--sans); font-size: 12px; }
    .evidence-table tbody th { font-size: 13px; }
    .evidence-table tbody th span { display: block; margin-top: 7px; color: var(--muted); font-size: 10px; font-weight: 400; }
    .evidence-table td { font-size: 12px; line-height: 1.65; }
    .company-heading { display: flex; align-items: center; gap: 8px; }
    .company-rule { width: 7px; height: 24px; background: var(--company); }

    .tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong); }
    .company-tab { min-height: 62px; border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
    .company-tab:last-child { border-right: 0; }
    .company-tab:hover { background: rgba(255, 254, 249, .5); color: var(--ink); }
    .company-tab[aria-selected="true"] { box-shadow: inset 0 -5px 0 var(--company); background: var(--paper); color: var(--ink); font-weight: 800; }
    button:focus-visible, a:focus-visible { outline: 3px solid rgba(23, 107, 96, .32); outline-offset: 3px; }
    .company-panel { --company: var(--pink); padding-top: 36px; }
    .company-intro { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 50px; margin-bottom: 34px; }
    .company-name { margin: 5px 0 3px; font-family: var(--display); font-size: 38px; line-height: 1.1; }
    .company-ticker { color: var(--muted); font-family: var(--mono); font-size: 11px; }
    .company-role { display: block; margin-top: 16px; color: var(--company); font-size: 12px; font-weight: 800; }
    .company-question { margin: 0 0 13px; font-family: var(--display); font-size: 23px; }
    .company-summary { margin: 0; color: var(--muted); }
    .company-verdict { display: inline-flex; margin-top: 18px; padding: 4px 9px; border: 1px solid var(--company); border-radius: 4px; color: var(--company); font-size: 11px; font-weight: 800; }
    .company-metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 4px solid var(--company); }
    .company-metric { min-height: 176px; padding: 20px 18px 18px 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .company-metric:nth-child(3n + 2), .company-metric:nth-child(3n + 3) { padding-left: 18px; }
    .company-metric:nth-child(3n) { border-right: 0; }
    .company-metric strong { display: block; margin: 8px 0 2px; font-family: var(--display); font-size: 27px; }
    .company-metric .metric-detail { min-height: auto; margin-top: 0; color: var(--company); font-family: var(--mono); }
    .case-split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px; margin-top: 34px; }
    .case-column { padding-top: 18px; border-top: 1px solid var(--green); }
    .case-column.counter { border-top-color: var(--red); }
    .case-column h3 { margin: 0 0 15px; color: var(--green); font-size: 13px; }
    .case-column.counter h3 { color: var(--red); }
    .case-column ul { margin: 0; padding: 0; list-style: none; }
    .case-column li { position: relative; margin: 10px 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
    .case-column li::before { position: absolute; left: 0; content: "+"; color: var(--green); font-family: var(--mono); font-weight: 800; }
    .case-column.counter li::before { content: "−"; color: var(--red); }

    .limitations-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 4px solid var(--red); }
    .limitation { min-height: 260px; padding: 22px 20px 20px 0; border-right: 1px solid var(--line); }
    .limitation + .limitation { padding-left: 20px; }
    .limitation:last-child { border-right: 0; }
    .limitation h3 { margin: 0 0 18px; font-family: var(--display); font-size: 20px; }
    .limitation p { margin: 0 0 13px; color: var(--muted); font-size: 12px; }
    .limitation strong { display: block; margin-bottom: 4px; color: var(--ink); font-size: 10px; text-transform: uppercase; }
    .next-test { margin: 32px 0 0; padding: 24px 0 0 24px; border-top: 1px solid var(--line); border-left: 5px solid var(--red); font-family: var(--display); font-size: 23px; line-height: 1.6; }

    .sources { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 34px; border-top: 1px solid var(--line-strong); }
    .source-row { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 14px; padding: 20px 0; border-bottom: 1px solid var(--line); }
    .source-index { color: var(--green); font-family: var(--mono); font-size: 11px; font-weight: 800; }
    .source-row h3 { margin: 0 0 4px; font-family: var(--display); font-size: 17px; }
    .source-row h3 a { text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .source-meta, .source-scope { margin: 0; color: var(--muted); font-size: 11px; }
    .source-scope { margin-top: 7px; }
    .footer { display: flex; justify-content: space-between; gap: 20px; padding: 30px 0 50px; color: var(--muted); font-size: 11px; }

    @media (max-width: 1050px) {
      .hero { grid-template-columns: 1fr; min-height: auto; gap: 40px; }
      .verdict-panel { padding: 28px 0 0; border-top: 1px solid var(--line-strong); border-left: 0; }
      .method-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .method-step { min-height: 230px; border-bottom: 1px solid var(--line); }
      .method-step:nth-child(2n) { border-right: 0; }
      .method-step:nth-child(2n + 1) { padding-left: 0; }
      .method-step:last-child { grid-column: 1 / -1; min-height: 190px; }
      .chart-grid { grid-template-columns: 1fr 1fr; }
      .chart-panel:last-child { grid-column: 1 / -1; }
      .calculation-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .calculation { border-bottom: 1px solid var(--line); }
      .calculation:nth-child(2n) { border-right: 0; }
      .calculation:nth-child(2n + 1) { padding-left: 0; }
      .limitations-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .limitation { border-bottom: 1px solid var(--line); }
      .limitation:nth-child(2n) { border-right: 0; }
      .limitation:nth-child(2n + 1) { padding-left: 0; }
    }

    @media (max-width: 760px) {
      .shell { width: min(100% - 28px, 1360px); }
      .topbar { min-height: 58px; }
      .hero { gap: 22px; padding: 34px 0 26px; }
      h1 { margin: 12px 0 14px; font-size: 36px; }
      .research-question { font-size: 13px; line-height: 1.7; }
      .origin { margin-top: 20px; padding-top: 12px; padding-left: 14px; }
      .origin blockquote { margin-top: 6px; font-size: 15px; line-height: 1.5; }
      .origin .citations { margin-top: 7px; }
      .verdict-panel { padding-top: 18px; }
      .status-row { margin-bottom: 10px; }
      .verdict-panel h2 { margin-bottom: 10px; font-size: 23px; }
      .verdict-panel p { font-size: 12px; line-height: 1.6; }
      .verdict-boundary { margin-top: 12px !important; padding-top: 10px; font-size: 11px !important; }
      .headline-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .headline-metric { min-height: 184px; padding: 20px 12px 18px 0; border-bottom: 1px solid var(--line); }
      .headline-metric + .headline-metric { padding-left: 12px; }
      .headline-metric:nth-child(2n) { border-right: 0; }
      .headline-metric:nth-child(2n + 1) { padding-left: 0; }
      .metric-value { font-size: 30px; }
      .section { padding: 58px 0; }
      .section-head { grid-template-columns: 1fr; gap: 18px; margin-bottom: 30px; }
      .section-head h2 { font-size: 31px; }
      .method-grid { grid-template-columns: 1fr; }
      .method-step, .method-step:last-child { grid-column: auto; min-height: auto; padding: 18px 0; border-right: 0; }
      .method-step + .method-step { padding-left: 0; }
      .method-step h3 { margin: 10px 0 6px; }
      .method-question { min-height: auto; }
      .method-proxy { margin-top: 10px; }
      .audit-row { grid-template-columns: 1fr; gap: 17px; padding: 24px 0; }
      .alternative { padding: 16px 0 0 18px; border-top: 1px solid var(--line); border-left-width: 4px; border-left-color: var(--red); }
      .chart-grid { grid-template-columns: 1fr; }
      .chart-panel, .chart-panel:last-child { grid-column: auto; min-height: 0; padding: 18px; }
      .calculation-grid { grid-template-columns: 1fr; }
      .calculation { min-height: auto; padding: 18px 0; border-right: 0; }
      .calculation + .calculation { padding-left: 0; }
      .comparison-charts { grid-template-columns: 1fr; }
      .comparison-chart { padding: 18px 12px; }
      .tabs { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .company-tab { min-height: 54px; padding: 4px; font-size: 12px; }
      .company-intro { grid-template-columns: 1fr; gap: 20px; }
      .company-name { font-size: 31px; }
      .company-question { font-size: 20px; }
      .company-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .company-metric { min-height: 165px; padding: 16px 10px 14px 0; }
      .company-metric:nth-child(3n + 2), .company-metric:nth-child(3n + 3) { padding-left: 0; }
      .company-metric:nth-child(3n) { border-right: 1px solid var(--line); }
      .company-metric:nth-child(2n) { padding-left: 10px; border-right: 0; }
      .company-metric strong { font-size: 22px; }
      .case-split { grid-template-columns: 1fr; gap: 26px; }
      .limitations-grid { grid-template-columns: 1fr; }
      .limitation { min-height: auto; padding: 20px 0; border-right: 0; }
      .limitation + .limitation { padding-left: 0; }
      .next-test { padding-left: 18px; font-size: 20px; }
      .sources { grid-template-columns: 1fr; }
      .footer { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body class="site-page site-research">
  <main>
    <div class="shell">
      <nav class="topbar" aria-label="站点导航">
        <a class="brand" href="../../index.html">reGeorge · Personal AI OS</a>
        <a href="../../index.html">返回首页</a>
      </nav>
      <div id="report-root"><div class="loading">正在载入研究证据……</div></div>
    </div>
  </main>

  <script>
    const esc = value => String(value ?? '').replace(/[&<>"']/g, character => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[character]));
    const reportRoot = document.querySelector('#report-root');
    let model;
    let sourceMap;
    let activeCompany = 'popmart';

    function sourceHref(reference) {
      const source = sourceMap[reference.sourceId];
      if (!source?.url) return '';
      return `${source.url}${reference.page ? `#page=${reference.page}` : ''}`;
    }

    function citations(references = []) {
      return `<span class="citations">${references.map(reference => {
        const source = sourceMap[reference.sourceId];
        const label = `${source?.index ?? reference.sourceId}${reference.page ? ` · p${reference.page}` : ''}`;
        const href = sourceHref(reference);
        return href ? `<a class="citation" href="${esc(href)}" target="_blank" rel="noreferrer">${esc(label)}</a>` : `<span class="citation">${esc(label)}</span>`;
      }).join('')}</span>`;
    }

    function headlineMetrics() {
      return model.headlineMetrics.map(metric => `<article class="headline-metric"><span class="metric-label">${esc(metric.label)}</span><strong class="metric-value">${esc(metric.value)}</strong><span class="metric-delta ${metric.deltaTone === 'risk' ? 'risk' : ''}">${esc(metric.delta)}</span><p class="metric-detail">${esc(metric.detail)}</p>${citations(metric.sourceRefs)}</article>`).join('');
    }

    function methodSteps() {
      return model.method.steps.map(step => `<article class="method-step"><span class="method-number">${esc(step.number)}</span><h3>${esc(step.label)}</h3><p class="method-question">${esc(step.question)}</p><p class="method-proxy">${esc(step.proxies)}</p><p class="method-limit">限制：${esc(step.limit)}</p></article>`).join('');
    }

    function auditRows() {
      return model.ppmtAudit.tests.map(test => `<article class="audit-row ${esc(test.tone)}"><div><span class="verdict-chip">${esc(test.verdict)}</span><h3>${esc(test.label)}</h3><span class="audit-strength">${esc(test.strength)}</span>${citations(test.sourceRefs)}</div><div><p class="audit-finding">${esc(test.finding)}</p><p class="audit-interpretation">${esc(test.interpretation)}</p></div><div class="alternative"><p class="micro-label">COMPETING EXPLANATION</p><p>${esc(test.alternative)}</p></div></article>`).join('');
    }

    function pairedChart(chart) {
      const content = chart.series.map(series => `<div class="series-group"><div class="series-name"><span>${esc(series.label)}</span><span>${esc(series.unit)}</span></div>${series.values.map(point => `<div class="bar-row"><span>${esc(point.year)}</span><span class="bar-track"><span class="bar-fill" style="width:${Math.max(0, Math.min(100, Number(point.value)))}%"></span></span><strong class="bar-value">${esc(point.value)}${esc(series.unit)}</strong></div>`).join('')}</div>`).join('');
      return `<article class="chart-panel"><h3>${esc(chart.title)}</h3><p class="chart-subtitle">${esc(chart.subtitle)}</p>${content}${citations(chart.sourceRefs)}</article>`;
    }

    function stackedChart(chart) {
      const rows = chart.series.map(row => `<div class="stack-row"><div class="stack-year">${esc(row.year)}</div><div class="stack-bar">${row.segments.map(segment => `<span class="stack-segment tone-${esc(segment.tone)}" style="width:${Number(segment.value)}%" title="${esc(segment.label)} ${esc(segment.value)}%"></span>`).join('')}</div></div>`).join('');
      const legendItems = chart.series[chart.series.length - 1].segments.map(segment => `<span class="legend-item"><span class="legend-swatch tone-${esc(segment.tone)}"></span>${esc(segment.label)} · ${esc(segment.value)}%</span>`).join('');
      return `<article class="chart-panel"><h3>${esc(chart.title)}</h3><p class="chart-subtitle">${esc(chart.subtitle)}</p>${rows}<div class="legend">${legendItems}</div>${citations(chart.sourceRefs)}</article>`;
    }

    function calculations() {
      return model.ppmtAudit.calculations.map(calculation => `<article class="calculation"><h3>${esc(calculation.label)}</h3><p class="formula">${esc(calculation.formula)}</p><strong>${esc(calculation.result)}</strong><p>${esc(calculation.meaning)}</p></article>`).join('');
    }

    function comparisonChart(title, note, rows, maxValue) {
      return `<article class="comparison-chart"><h3>${esc(title)}</h3><p>${esc(note)}</p>${rows.map(row => {
        const company = model.companies.find(item => item.id === row.companyId);
        const changeClass = row.change < 0 ? 'change-down' : row.change > 0 ? 'change-up' : '';
        const changeSign = row.change > 0 ? '+' : '';
        return `<div class="company-bar-row" style="--company:${esc(company.accent)}"><span class="company-bar-name">${esc(row.company)}</span><span class="paired-track"><span class="paired-line"><span class="paired-fill" style="width:${Math.min(100, row.y2024 / maxValue * 100)}%"></span></span><span class="paired-line"><span class="paired-fill" style="width:${Math.min(100, row.y2025 / maxValue * 100)}%"></span></span></span><span class="company-bar-value">${esc(row.y2025)}%<br><span class="${changeClass}">${changeSign}${esc(row.change)}pct</span></span></div>`;
      }).join('')}</article>`;
    }

    function evidenceMatrix() {
      const headings = model.companies.map(company => `<th scope="col"><span class="company-heading" style="--company:${esc(company.accent)}"><span class="company-rule"></span>${esc(company.name)}</span></th>`).join('');
      const rows = model.crossCompany.matrix.map(row => `<tr><th scope="row">${esc(row.dimension)}<span>${esc(row.comparability)}</span></th>${model.companies.map(company => `<td>${esc(row.cells[company.id])}</td>`).join('')}</tr>`).join('');
      return `<div class="table-wrap"><table class="evidence-table"><thead><tr><th scope="col">证据环节</th>${headings}</tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    function tabs() {
      return model.companies.map(company => `<button class="company-tab" role="tab" aria-selected="${company.id === activeCompany}" data-company="${esc(company.id)}" style="--company:${esc(company.accent)}">${esc(company.name)}</button>`).join('');
    }

    function companyPanel() {
      const company = model.companies.find(item => item.id === activeCompany) ?? model.companies[0];
      const metrics = company.metrics.map(metric => `<article class="company-metric"><span class="metric-label">${esc(metric.label)}</span><strong>${esc(metric.value)}</strong><p class="metric-detail">${esc(metric.delta)}</p>${citations(metric.sourceRefs)}</article>`).join('');
      const list = items => `<ul>${items.map(item => `<li>${esc(item)}</li>`).join('')}</ul>`;
      return `<article class="company-panel" style="--company:${esc(company.accent)}"><div class="company-intro"><div><p class="micro-label">${esc(company.role)}</p><h3 class="company-name">${esc(company.name)}</h3><span class="company-ticker">${esc(company.ticker)}</span><span class="company-role">${esc(company.verdict)}</span></div><div><p class="company-question">${esc(company.question)}</p><p class="company-summary">${esc(company.summary)}</p><span class="company-verdict">${esc(company.verdict)}</span></div></div><div class="company-metrics">${metrics}</div><div class="case-split"><section class="case-column"><h3>支持这条假设的证据</h3>${list(company.supports)}</section><section class="case-column counter"><h3>反证与竞争解释</h3>${list(company.counters)}</section></div></article>`;
    }

    function limitations() {
      const items = model.limitations.items.map(item => `<article class="limitation"><h3>${esc(item.missing)}</h3><p><strong>为什么缺</strong>${esc(item.why)}</p><p><strong>下一步要什么</strong>${esc(item.needed)}</p></article>`).join('');
      return `${items}<blockquote class="next-test">${esc(model.limitations.nextTest)}</blockquote>`;
    }

    function sources() {
      return model.sources.map(source => {
        const title = source.url ? `<a href="${esc(source.url)}" target="_blank" rel="noreferrer">${esc(source.title)}</a>` : esc(source.title);
        return `<article class="source-row"><span class="source-index">${esc(source.index)}</span><div><h3>${title}</h3><p class="source-meta">${esc(source.kind)} · ${esc(source.publisher)} · ${esc(source.date)}</p><p class="source-scope">${esc(source.scope)}</p></div></article>`;
      }).join('');
    }

    function bindTabs() {
      document.querySelectorAll('.company-tab').forEach(button => button.addEventListener('click', () => {
        activeCompany = button.dataset.company;
        document.querySelectorAll('.company-tab').forEach(tab => tab.setAttribute('aria-selected', String(tab.dataset.company === activeCompany)));
        document.querySelector('#company-panel-root').innerHTML = companyPanel();
      }));
    }

    function render() {
      const research = model.research;
      reportRoot.innerHTML = `
        <header class="hero">
          <div><p class="eyebrow">${esc(research.eyebrow)}</p><h1>${esc(research.title)}</h1><p class="research-question">${esc(research.question)}</p><div class="origin"><p class="micro-label">${esc(research.origin.label)}</p><blockquote>${research.origin.quotes.map(quote => `<span>${esc(quote)}</span>`).join('')}</blockquote>${citations([{sourceId: research.origin.sourceId}])}</div></div>
          <aside class="verdict-panel"><div class="status-row"><span class="status-dot"></span><span class="status-label">研究判断 · ${esc(model.status)}</span></div><h2>${esc(research.verdict.label)}</h2><p>${esc(research.verdict.summary)}</p><p class="verdict-boundary">${esc(research.verdict.boundary)}</p></aside>
        </header>
        <section class="headline-strip" aria-label="泡泡玛特关键研究指标">${headlineMetrics()}</section>
        <section class="section" id="method"><div class="section-head"><div><p class="section-kicker">METHOD</p><h2>${esc(model.method.title)}</h2></div><p>${esc(model.method.note)}</p></div><div class="method-grid">${methodSteps()}</div></section>
        <section class="section" id="ppmt-audit"><div class="section-head"><div><p class="section-kicker">PPMT HYPOTHESIS AUDIT</p><h2>${esc(model.ppmtAudit.title)}</h2></div><p>${esc(model.ppmtAudit.summary)}</p></div><div class="audit-list">${auditRows()}</div><div class="chart-grid">${pairedChart(model.ppmtAudit.charts.member)}${stackedChart(model.ppmtAudit.charts.category)}${pairedChart(model.ppmtAudit.charts.economics)}</div><div class="calculation-grid">${calculations()}</div></section>
        <section class="section" id="comparison"><div class="section-head"><div><p class="section-kicker">CROSS-COMPANY CHECK</p><h2>${esc(model.crossCompany.title)}</h2></div><p>${esc(model.crossCompany.note)}</p></div><div class="comparison-charts">${comparisonChart('广义销售费用率', '灰色为 2024，品牌色为 2025。只比较方向。', model.crossCompany.sellingIntensity, 30)}${comparisonChart('毛利率', '灰色为 2024，品牌色为 2025。行业间绝对值不可比。', model.crossCompany.grossMargin, 100)}</div>${evidenceMatrix()}</section>
        <section class="section" id="companies"><div class="section-head"><div><p class="section-kicker">COMPANY FILES</p><h2>四家公司，各自接受一次反驳</h2></div><p>同一个“情绪价值”标签背后，泡泡玛特是 IP、腾讯是平台关系、小米是产品生态、茅台是稀缺与仪式。它们不能用同一套故事代替各自的数据。</p></div><div class="tabs" role="tablist" aria-label="四家公司研究页签">${tabs()}</div><div id="company-panel-root">${companyPanel()}</div></section>
        <section class="section" id="limitations"><div class="section-head"><div><p class="section-kicker">EVIDENCE GAP</p><h2>${esc(model.limitations.title)}</h2></div><p>研究不以“找到支持”为结束，而以知道下一条最有区分度的数据是什么为结束。</p></div><div class="limitations-grid">${limitations()}</div></section>
        <section class="section" id="sources"><div class="section-head"><div><p class="section-kicker">PRIMARY SOURCES</p><h2>原始来源与口径</h2></div><p>核心数字只采用公司 IR、香港交易所公告或经审计年报。个人感知只负责提出问题，不负责证明答案。</p></div><div class="sources">${sources()}</div></section>
        <footer class="footer"><span>研究状态：${esc(model.status)} · 不构成投资建议</span><span>数据期：${esc(research.period)} · 更新：${esc(model.updatedAt)}</span></footer>`;
      bindTabs();
    }

    fetch('../../data/emotional-value-businesses.json')
      .then(response => { if (!response.ok) throw new Error('research data load failed'); return response.json(); })
      .then(data => { model = data; sourceMap = Object.fromEntries(model.sources.map(source => [source.id, source])); render(); })
      .catch(error => { reportRoot.innerHTML = `<div class="loading">研究数据读取失败：${esc(error.message)}</div>`; });
  </script>
</body>
</html>
